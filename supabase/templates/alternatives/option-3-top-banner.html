<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Confirm Your Email Address</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Gabarito", Calibri, sans-serif;
        line-height: 1.6;
        color: #342a24;
        margin: 0;
        background-color: #f2e7d2;
        font-size: 16px;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
      }
      .banner {
        background-color: #55443c;
        padding: 28px 24px;
        text-align: center;
      }
      .banner svg {
        width: 30px;
        height: 30px;
        display: block;
        margin: 0 auto 8px;
      }
      .icon-stroke {
        stroke: #f2e7d2;
      }
      .wordmark {
        color: #f2e7d2;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .content {
        padding: 48px 32px 40px;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
        font-weight: 700;
        color: #342a24;
      }
      p.description {
        margin: 0 auto 32px;
        color: #342a24;
        max-width: 38ch;
      }
      .button {
        display: inline-block;
        background-color: #55443c;
        color: #fafaf9 !important;
        padding: 13px 30px;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
      }
      .footer-text {
        margin: 32px 0 0;
        font-size: 13px;
        color: #7a6a5c;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #241d19;
          color: #f0e8e0;
        }
        .banner {
          background-color: #ccb3a3;
        }
        .icon-stroke {
          stroke: #241d19;
        }
        .wordmark {
          color: #241d19;
        }
        h1 {
          color: #f0e8e0;
        }
        p.description {
          color: #f0e8e0;
        }
        .button {
          background-color: #ccb3a3;
          color: #241d19 !important;
        }
        .footer-text {
          color: #b7aca2;
        }
      }

      @media only screen and (max-width: 480px) {
        .content {
          padding: 36px 20px 32px;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="banner">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path class="icon-stroke" d="M15.236 22a3 3 0 0 0-2.2-5"></path>
          <path
            class="icon-stroke"
            d="M16 20a3 3 0 0 1 3-3h1a2 2 0 0 0 2-2v-2a4 4 0 0 0-4-4V4"
          ></path>
          <path class="icon-stroke" d="M18 13h.01"></path>
          <path
            class="icon-stroke"
            d="M18 6a4 4 0 0 0-4 4 7 7 0 0 0-7 7c0-5 4-5 4-10.5a4.5 4.5 0 1 0-9 0 2.5 2.5 0 0 0 5 0C7 10 3 11 3 17c0 2.8 2.2 5 5 5h10"
          ></path>
        </svg>
        <div class="wordmark">Rezepte</div>
      </div>

      <div class="content">
        <h1>Confirm Your Email Address</h1>
        <p class="description">
          Thanks for signing up for Rezepte. Confirm this email address to
          activate your account and start saving recipes.
        </p>

        <a href="{{ .ConfirmationURL }}" class="button"
          >Confirm &amp; Activate Account</a
        >

        <p class="footer-text">
          If you didn't create a Rezepte account, you can safely ignore this
          email.
        </p>
      </div>
    </div>
  </body>
</html>
