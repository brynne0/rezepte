    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script>
      // Set theme immediately to prevent flash
      (function () {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch (e) {
          // localStorage not available (private browsing, file:// protocol, etc.)
        }

        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const isDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" && systemPrefersDark);

        if (isDark) {
          document.documentElement.classList.add("dark");
        }

        // Santa squirrel from 24 Nov to 6 Jan; ?santa=1 forces it for testing
        const now = new Date();
        const m = now.getMonth();
        const d = now.getDate();
        const isSanta =
          (m === 10 && d >= 24) || m === 11 || (m === 0 && d <= 6);
        if (isSanta || /[?&]santa=1/.test(location.search)) {
          document.documentElement.classList.add("santa");
        }
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #efe6d6;
        z-index: 9999;
      }
      html.dark #splash {
        background: #241d19;
      }
      #splash svg {
        width: 80px;
        height: 80px;
        stroke: #55443c;
      }
      html.dark #splash svg {
        stroke: #f2e7d2;
      }
      /* Santa squirrel (html.santa): filled hat in light mode, glow-line hat in dark mode */
      #splash .splash-light,
      #splash .splash-dark,
      html.santa #splash .splash-plain,
      html.santa.dark #splash .splash-light {
        display: none;
      }
      html.santa #splash .splash-light {
        display: block;
      }
      html.santa.dark #splash .splash-dark {
        display: block;
        stroke: #ccb3a3;
      }
    </style>
