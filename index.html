<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme colors for light and dark mode -->
    <meta
      name="theme-color"
      content="#efe6d6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#241d19"
      media="(prefers-color-scheme: dark)"
    />
    <title>Rezepte</title>
    <link rel="manifest" href="/eichhörnchen/site.webmanifest" />
    <link href="/src/style.css" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/eichhörnchen/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      href="/eichhörnchen/favicon-96x96.png"
      sizes="96x96"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/eichhörnchen/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Rezepte" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Preload Fonts -->
    <link
      rel="preload"
      href="/fonts/forta.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script>
      // Set theme immediately to prevent flash
      (function () {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch (e) {
          // localStorage not available (private browsing, file:// protocol, etc.)
        }

        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const isDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" && systemPrefersDark);

        if (isDark) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #efe6d6;
        z-index: 9999;
      }
      html.dark #splash {
        background: #241d19;
      }
      #splash svg {
        width: 80px;
        height: 80px;
        stroke: #55443c;
      }
      html.dark #splash svg {
        stroke: #f2e7d2;
      }
    </style>
  </head>
  <body>
    <!-- squirrels.js fills this and must stay right after it -->
    <div id="splash"></div>
    <script src="/squirrels.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
